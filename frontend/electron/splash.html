<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>TMAM</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #303133;
    }
    .header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid #e4e7ed;
      font-weight: 600;
      font-size: 16px;
    }
    .main {
      height: calc(100% - 60px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #dcdfe6;
      border-top-color: #409eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .status {
      font-size: 14px;
      color: #606266;
    }
    .hint {
      font-size: 12px;
      color: #909399;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">TMAM — Tomcat Service Manager</div>
  <div class="main">
    <div class="spinner"></div>
    <div class="status">正在啟動本機服務…</div>
    <div class="hint">首次啟動可能需要幾秒</div>
  </div>
</body>
</html>
